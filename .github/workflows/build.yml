name: build
on:
  push:
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
      - run: pip install platformio
      - run: pio run 
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: .pio/build/esp32dev/firmware.bin
